<!doctype html>
<html><head><meta charset="utf-8"><style>
@import url('https://fonts.googleapis.com/css2?family=Newsreader:wght@600;700&family=IBM+Plex+Mono:wght@500&display=swap');
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 1200px; height: 630px; background: #FAF7F2; font-family: "Newsreader", Georgia, serif; -webkit-font-smoothing: antialiased; }

h1 .accent { color: #E04F2C; }
.sub { font-size: 26px; line-height: 1.32; color: #5C544A; font-family: -apple-system, "Helvetica Neue", sans-serif; max-width: 560px; }
.foot { position: absolute; left: 80px; right: 80px; bottom: 44px; display: flex; justify-content: space-between; align-items: center; font-family: "IBM Plex Mono", monospace; font-size: 16px; color: #5C544A; letter-spacing: 0.08em; text-transform: uppercase; }
.foot .l { display: flex; gap: 18px; align-items: center; }
.foot .sep { color: #B5A99A; }

  <div class="foot">
    <div class="l"><span>usehatch.xyz</span><span class="sep">·</span><span>@usehatch_</span></div>
